schema_version: 1
records:
- type: reference
  id: reference.hazard.ready-not-requested
  title: Gate on section initialisation, not on the load request
  summary: A section's copy or load-request bit can be set before its constructors run.
  source_refs:
  - source.om5.startup-fix
  - source.emu.caduceus-om3
  - source.omkit.firmware
  topics:
  - patching
  last_reviewed: '2026-11-18'
  category: hazard
  camera_ids:
  - camera.om5-ii
  - camera.om3
  firmware_ids:
  - firmware.om5-ii-1100
  - firmware.om3-1100
  note: 'Test the word the firmware''s own wait uses: OM-5 Mark II 0xa26e2694, not 0xa26e2698; OM-3 0xa32de58c,
    not 0xa32de590, which the loader sets whatever the copy returned.'
  consequence: Hooks reached early in boot may call code or data that is not initialised yet.
  symptoms:
  - symptom.start-failure
  observations:
  - method: static-analysis
    source_ref: source.om5.startup-fix
    project_id: project.caduceus-om5
    summary: E148 guards tested decoder submission; corrected to completed initialisation.
  - method: static-analysis
    source_ref: source.emu.caduceus-om3
    project_id: project.om-emu
    summary: OM-3 sets 0xa32de590 regardless of the copy result; 0xa32de58c is set after constructors.
  conflicts:
  - source_ref: source.omkit.firmware
    summary: OMKit describes 0xa26e2698 as set once each section is in place and gates its card loader on 0x3ff there;
      that loader reads files about 1.2 s into startup and has started on the developers' camera since 2026-10-30.
  upstream_detail: https://github.com/xulfr/caduceus-om5/blob/a72851a4ada5eab8eed02f7a06afd7f9297bbe81/research/OM5II-STARTUP-FIX-2026-11-06.md
- type: reference
  id: reference.hazard.ff-is-not-free
  title: Take section bounds from the loader, not from 0xFF runs
  summary: An 0xFF run in the file can lie outside the section load, so code placed there is never loaded.
  source_refs:
  - source.fishcu.code-space
  - source.om5.startup-fix
  - source.emu.caduceus-om3
  topics:
  - patching
  last_reviewed: '2026-11-18'
  category: hazard
  camera_ids:
  - camera.om3
  - camera.om5-ii
  - camera.pen-f
  firmware_ids:
  - firmware.om3-1100
  - firmware.om5-ii-1100
  - firmware.pen-f-3101
  note: Use the descriptor table and end selector, then check references, initialiser counts and runtime ownership.
    Emulators that map the whole file can hide the error.
  consequence: Calls into unloaded bytes run leftover RAM.
  symptoms:
  - symptom.start-failure
  observations:
  - method: static-analysis
    source_ref: source.fishcu.code-space
    project_id: project.oly-fw-analysis
    summary: Large FF runs in OM-3 1100 are mostly outside the loads.
  - method: static-analysis
    source_ref: source.om5.startup-fix
    project_id: project.caduceus-om5
    summary: An OM-5 II overlay ran 3,036 bytes past section 5; a direct-memory emulator fixture hid it.
  - method: physical-camera
    source_ref: source.emu.caduceus-om3
    project_id: project.caduceus-om3
    summary: Caduceus gap probes on the OM-3 found leftover RAM, not 0xFF, between sections.
  conflicts: []
  upstream_detail: https://github.com/fishcu/oly_fw_analysis/blob/d565cb664d3bc37f883f844a3a0c9620efe018e4/docs/safety/CODE_SPACE.md#om-3-v22-precedent
- type: reference
  id: reference.hazard.updater-section-stock
  title: Leave the compressed section holding the card updater stock
  summary: On the OM-5 Mark II the card updater is in compressed section 7; repacking it puts recovery at risk.
  source_refs:
  - source.om5.section7
  topics:
  - patching
  last_reviewed: '2026-11-18'
  category: hazard
  camera_ids:
  - camera.om5-ii
  firmware_ids:
  - firmware.om5-ii-1100
  note: 'Preserve the stored span at main-payload offset 0xc9d7e0, and preferably section 6 too. This is the project''s
    inference: no failure has been traced to it.'
  consequence: If section 7 fails to load, the card updater may not run to restore stock.
  symptoms:
  - symptom.recovery-at-risk
  observations:
  - method: static-analysis
    source_ref: source.om5.section7
    project_id: project.caduceus-om5
    summary: FIRMUP_CLI is inside section 7; the builder can preserve the stored spans.
  conflicts: []
  upstream_detail: https://github.com/xulfr/caduceus-om5/blob/a72851a4ada5eab8eed02f7a06afd7f9297bbe81/research/OM5II-STOCK-SECTION7.md#build-boundary
- type: reference
  id: reference.hazard.kept-ram-hides-cold-start
  title: Test start-up changes after a long power-off, not a quick restart
  summary: RAM kept across a short power-off can still hold code a start has not loaded yet, which hides load-order faults.
  source_refs:
  - source.epm2.slow-boot
  topics:
  - patching
  - emulation
  last_reviewed: '2026-11-25'
  category: hazard
  camera_ids:
  - camera.epm2
  firmware_ids:
  - firmware.epm2-1600
  note: On the E-PM2 a start within about 30 s of power-off still found segment 2 in RAM from the last start; after
    45 to 60 s off it had decayed. The project's test sheets now include starts after 2 minutes off and with the
    battery out. Its emulator could not show the fault, because it has no live view and copies segments in about 1 ms.
  consequence: Slow or failed cold starts that quick restarts and the emulator never show. On the E-PM2, about 10 s
    until the camera can shoot, inferred to pass through a hidden restart.
  symptoms:
  - symptom.slow-start
  - symptom.start-failure
  observations:
  - method: physical-camera
    source_ref: source.epm2.slow-boot
    project_id: project.epm2mod
    summary: The reporter and a contributor saw slow starts after 45 to 60 s off and fast ones after 10 s off. The
      owner's timed starts all kept RAM, even after more than 60 s off, and took about 2 s.
  - method: emulator
    source_ref: source.epm2.slow-boot
    project_id: project.epm2mod
    summary: Boots with RAM zeroed, filled with 0xFF, random or kept from an earlier run all started normally, stock
      and modded alike.
  conflicts: []
  upstream_detail: https://github.com/cfu288/EPM2Mod/blob/3b6827892ed4f031a72acb7fec4496aaf9a29348/experiments/2026-11-24-slow-boot/NOTES.md
- type: reference
  id: reference.hazard.check-built-image
  title: Check hook targets in the built image, not in each patch's own bytes
  summary: When two patches write the same site, a per-patch check reads the wrong bytes and can miss the jump that ships.
  source_refs:
  - source.epm2.slow-boot
  topics:
  - patching
  - tooling
  last_reviewed: '2026-11-25'
  category: hazard
  camera_ids:
  - camera.epm2
  firmware_ids:
  - firmware.epm2-1600
  note: EPM2Mod's hook check decoded each patch on its own, so a later patch's jump from early-loaded code into
    segment 2 was reported as the earlier patch's jump. The check now decodes the built bytes of every change in
    early-loaded space, with overlapping changes as one run, and lists stock pointers that a change rewrites.
  consequence: A jump into late-loaded code passed the check and shipped from rc.3 to v2026.11.20 on the E-PM2.
  symptoms:
  - symptom.slow-start
  - symptom.start-failure
  observations:
  - method: static-analysis
    source_ref: source.epm2.slow-boot
    project_id: project.epm2mod
    summary: The rebuilt check finds that jump as the one failure of the pinned spot-af-2 build. Its audit lists 187
      transfers out of patched early-loaded code, 88 of them into segments 2 or 3.
  conflicts: []
  upstream_detail: https://github.com/cfu288/EPM2Mod/blob/3b6827892ed4f031a72acb7fec4496aaf9a29348/experiments/2026-11-24-slow-boot/NOTES.md
