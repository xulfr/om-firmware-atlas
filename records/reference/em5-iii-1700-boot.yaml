- type: reference
  id: reference.em5-iii-1700.always-ready-range
  title: Always-ready range copied by the boot stub
  summary: Ready before any section loads; boot guards and small stubs can live here.
  source_refs:
  - source.em5n.boot
  topics:
  - platform
  - patching
  last_reviewed: '2026-11-18'
  category: layout
