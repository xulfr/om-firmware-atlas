  address:
    space: runtime-cached
    value: '0x60030000'
    end: '0x600d0800'
  note: The end comes from one immediate at 0x600211af. Everything else in block 0 loads later in ten sections.
  observations:
  - method: static-analysis
    source_ref: source.em5n.boot
    project_id: project.em5-iii-notes
