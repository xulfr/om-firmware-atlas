  id: reference.epm2-1600.main-cpu-base
  title: Main CPU base, E-PM2 1.6
  summary: Runtime address = block 0 offset + 0x7E421020; no edit lines up with the E-P7's 0x60020020 base.
  source_refs:
  - source.epm2.format
  - source.epm2.feasibility
