  address:
    space: runtime-cached
    value: '0x7e421020'
  note: Block 0 is 14,155,712 bytes of MN103 code under uITRON, not compressed. The base differs per TruePic VI body.
  observations:
  - method: static-analysis
    source_ref: source.epm2.format
    project_id: project.epm2mod
    summary: Base verified by disassembly of block 0.
