schema_version: 1
records:
- type: reference
  id: reference.em5-iii-1700.settings-image
  title: User settings image (store 50)
  summary: 256 KB RAM image of the user settings, loaded whole at boot and saved whole at power-off.
  source_refs:
  - source.em5n.saved-settings
  topics:
  - colour
  - patching
  last_reviewed: '2026-11-19'
  category: data
  camera_ids:
  - camera.em5-iii
  firmware_ids:
  - firmware.em5-iii-1700
  address:
    space: runtime-cached
    value: '0x623d1000'
    end: '0x62411000'
  note: Stock records end well before the end; bytes in the unused tail are saved and restored too, and stock code
    never reads them. A block at +0x39f00 (0x6240af00) holds mod settings behind a 4-byte marker.
  observations:
  - method: static-analysis
    source_ref: source.em5n.saved-settings
    project_id: project.em5-iii-notes
    summary: Boot load and save compare read from the store code.
  - method: physical-camera
    source_ref: source.em5n.saved-settings
    project_id: project.em5-iii-notes
    summary: Values written in the tail survive power-off.
  conflicts: []
  upstream_detail: https://github.com/nsud-dev/olympus-firmware-notes/blob/3fcbb287c7e5f39f9e8d3b382eede5951d7ecb00/docs/features/saved-settings-and-menu-rows.md#where-the-values-live
- type: reference
  id: reference.em5-iii-1700.settings-save
  title: Settings store save
  summary: Writes a settings store to flash only when the live image differs from the saved bank.
  source_refs:
  - source.em5n.saved-settings
  topics:
  - colour
  last_reviewed: '2026-11-19'
  category: function
  camera_ids:
  - camera.em5-iii
  firmware_ids:
  - firmware.em5-iii-1700
  address:
    space: runtime-cached
    value: '0x6005aaaf'
  note: Compares the whole image, updates counter and 16-bit sum, writes flash. Called from the power-down path.
  observations:
  - method: static-analysis
    source_ref: source.em5n.saved-settings
    project_id: project.em5-iii-notes
    summary: Read from the store code and its callers.
  conflicts: []
  upstream_detail: https://github.com/nsud-dev/olympus-firmware-notes/blob/3fcbb287c7e5f39f9e8d3b382eede5951d7ecb00/docs/features/saved-settings-and-menu-rows.md#where-the-values-live
