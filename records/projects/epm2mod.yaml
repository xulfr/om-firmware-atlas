  tagline: Film simulations, interval shooting, focus peaking and a level gauge for the PEN E-PM2.
  description:
  - EPM2Mod is a firmware mod for the Olympus PEN E-PM2 (2012), the oldest body in the Atlas. It loads film
    simulations such as Portra, Ektachrome and Velvia into the art-filter entries, and adds interval shooting up
    to 240 frames, a level gauge, focus peaking and a lowest shutter speed for ISO Auto.
  - The E-PM2 is two image-processor generations older than the bodies the Caduceus family patches and has no
    Color Profiles, so nothing carries over by address. The film simulations are fitted to the camera's own adjustable
    tone and six-axis colour stages from spektrafilm and Spectral Film LUT renders, and a film file on the
    card is loaded from a Custom Menu row. The camera keeps them, with their names, after power-off and without
    the card.
  - The research is unusually explicit about evidence. Every limit is labelled verified, inferred or unknown, each
    flash is logged before and after, and each build that moves a hook is run through an emulator boot test first.
    Five builds failed on the camera, and a normal card update recovered each; a recovery from a boot loop has not
    been recorded on this body. The project says it was made with heavy use of AI assistance.
  goals:
  - Add Effects on film simulations, and a higher movie bit rate without the 29-minute limit.
  - The other E-PL6 additions, such as a small AF target and ISO LOW, and a simple on-camera editor.
