  tagline: Film looks, colour editors and a longer video limit for the original OM-D E-M10.
  description:
  - om10mi-mods adds firmware features to the Olympus OM-D E-M10 Mark I (E113) on firmware 1.4. Version 56 has
    18 film looks, each with its own colour matrix and tone curve, a per-sector Hue, Saturation and Lightness
    editor for 12 colours, a per-look colour editor, looks in RAW Data Edit Custom1 and Custom2, and a video
    recording limit raised from 29:59 to 59:50.
  - The repository holds no firmware. A builder downloads the official 1.4 file from OM Digital Solutions after
    the user accepts its licence, applies a list of edits, and refuses to write anything unless the result
    matches the published SHA-1. It also writes a copy of the stock file for going back through the card update.
  - The look data is numbers fitted to Fujifilm film-simulation, spektrafilm, HaldCLUT and Spectral Film LUT
    references; no LUT files are shipped. Caduceus for the E-P7 is credited as the design reference for the look
    editor. Everything was made and tested on the author's one camera body.
  goals:
  - A colour wheel on the Color Creator screen, like the PEN-F's; working on the owner's camera in internal test
    builds 57 to 78, not released.
  - Importing a LUT or .cube file into a chosen look slot as an approximate look, after the colour wheel.
  - Own icons for the four newest looks, which borrow existing icons.
