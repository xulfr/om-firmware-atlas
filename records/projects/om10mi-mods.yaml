    prerelease: true
    camera_ids: *id001
    highlights:
    - Each colour look gets its own User Hue page from Picture Mode's right arrow; User Hue Reset moved there.
    warning: Superseded pre-release. Its RAW Data Edit Sector, Hue, Sat and Light rows had little or no effect, fixed
      in 94.
    source_ref: source.om10mi.releases
  - tag: v87
    title: 'Version 87: colour wheel + own look icons'
    date: '2026-11-21'
    url: https://github.com/Meghnus/om10mi-mods/releases/tag/v87
    prerelease: false
    camera_ids: *id001
    highlights:
    - Colour wheel in Color Creator at the ART dial, with an on-screen key hint and a COLOR WHEEL mode guide.
    - Own icons for Portra 400, Kodachrome 64, Ektar 100 and Gold 200.
    - Contrast/Gradation code on looks made safe when two images are processed at once (related to issue 4).
    - Pop-up message frames use the correct graphic again; the builder makes version 87 only.
    warning: Superseded by 94. Unofficial, for the E-M10 Mark I on firmware 1.4 only; tested on one body. No warranty; installing
      custom firmware is risky. The ART dial no longer reaches the stock art filters.
    source_ref: source.om10mi.releases
  - tag: v56
    title: Look pack 56 for the Olympus OM-D E-M10 Mark I (firmware 1.4)
    date: '2026-11-10'
    url: https://github.com/Meghnus/om10mi-mods/releases/tag/v56
    prerelease: false
    camera_ids: *id001
    highlights:
    - Four new looks (Portra 400, Kodachrome 64, Ektar 100, Gold 200) and per-bank editing rows in RAW Data Edit.
    - Builder for Windows (exe, no Python) or any system (zip, Python 3.10+); downloads and checks the stock file.
    warning: Unofficial, for the E-M10 Mark I on firmware 1.4 only; tested on one body. Do not flash on any other
      model. Installing is at your own risk.
    source_ref: source.om10mi.releases
