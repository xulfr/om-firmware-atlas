  features:
  - name: Film looks
    summary: 18 looks in Picture Mode, the SCP menu, Live View and RAW Data Edit, including Portra 400, Kodachrome
      64, Ektar 100 and Gold 200, each with its own icon since 87; Contrast, Sharpness, Highlight, Shadow and
      Gradation act on them.
    camera_ids: &id001
    - camera.em10
    status: released
    since: v56
    source_ref: source.om10mi.readme
  - name: Per-sector colour editor
    summary: Hue, Saturation and Lightness for 12 named colour sectors, also per bank in RAW Data Edit.
    camera_ids: *id001
    status: released
    since: v56
    source_ref: source.om10mi.readme
    capability_id: capability.em10-v56-hsl
  - name: Per-look colour editor
    summary: Each colour look has its own User Hue page (Picture Mode, highlight the look, right arrow) with Sector,
      Hue, Sector Sat and Lightness; it moved there from the Custom page in 88.
    camera_ids: *id001
    status: released
    since: v56
    source_ref: source.om10mi.readme
  - name: 59:50 video limit
    summary: Recording limit raised from 29:59 to 59:50; one file is still capped at 4 GB, so high bit rates can
      stop earlier. Recording past 30 minutes is not yet confirmed.
    camera_ids: *id001
    status: released
    since: v56
    source_ref: source.om10mi.readme
  - name: Colour wheel
    summary: PEN-F-style wheel in Color Creator at the ART dial; mark one or more of 12 sectors and set Hue,
      Saturation and Lightness from -7 to +7 with a live preview that matches the JPEG; kept after power-off. Since
      94 it is roughly centred in the viewfinder and white balance can be set inside Color Creator. The ART dial no
      longer reaches the stock art filters.
    camera_ids: *id001
    status: released
    since: v87
    source_ref: source.om10mi.color-wheel
    capability_id: capability.em10-v87-colour-wheel
  - name: Look pack builder
    summary: An optional PC tool and browser pages replace looks from a .cube or .xmp file, rename them and reorder
      the Picture Mode list, working on the image the user built. A look is a fitted approximation of the LUT;
      hiding looks is refused because it is not proven on a camera.
    camera_ids: *id001
    status: released
    since: v94
    source_ref: source.om10mi.readme
  releases:
  - tag: v94
    title: 'Version 94: RAW edit rows fixed, EVF-centred colour wheel, optional look pack builder'
    date: '2026-11-24'
    url: https://github.com/Meghnus/om10mi-mods/releases/tag/v94
    prerelease: false
    camera_ids: *id001
    installation:
      camera.em10:
        firmware_id: firmware.em10-1400
        url: https://github.com/Meghnus/om10mi-mods/blob/84d4f36365270a9393d0b46b8beeae44a8e3491d/INSTALL.md
    highlights:
    - The RAW Data Edit Custom1 and Custom2 Sector, Hue, Sat and Light rows now change the developed picture.
    - The colour wheel is roughly centred in the viewfinder, and white balance can be set inside Color Creator.
    - The SCP Contrast, Sharpness and Saturation follow each look's own rows.
    - An optional look pack builder makes looks from your own .cube or .xmp files.
    warning: Unofficial, for the E-M10 Mark I on firmware 1.4 only; made and tested on a single body. No warranty;
      installing custom firmware is risky. The ART dial no longer reaches the stock art filters.
    source_ref: source.om10mi.releases
  - tag: v88
