  status_summary: The latest packaged builder is mod-builder-1.19 for stock firmware 1.6. The project is active again. On 2026-11-20 the author had declared the project ended; on 2026-11-21 the README says it continues and release mod-builder-1.18 adds Fill In next to Manual flash in handheld High Res (test 1.745). On the main branch after 1.19, a Picture Mode button mod and a Monochrome II change that removes and disables the Star Light art effect await camera re-tests. On 2026-11-24 the main branch also removed the Multiple Exposure and Caduceus film-look mods, folded White frame in Panorama into White Frame, fixed a restart with HDR in the linear Sharpness mod, and gave the builder a new layout. None of this is in a release yet.
