  kind: tool
  camera_ids:
  - camera.em5-iii
  contribution_home: https://github.com/nsud-dev/olympus-firmware-notes/issues
  status_summary: Plain patch files for a fixed om-emu commit. Offered here until om-emu takes them upstream. Tested on E-M5 III 1.7, and briefly on OM-5 1.2 and OM-5 II 1.1 block 0.
  related_projects:
  - project.om-emu
  - project.em5-iii-notes
  tagline: Extra screen layers and crash checks for om-emu, as patch files.
  description:
  - Eleven small patches to om-emu, the emulator by the om-emu contributors. They ship as git diff files with an
    apply script and om-emu's MIT notice. There is no fork. Four patches add drawing, such as the 32-bit layer the vector GPU draws
    into and a still picture under the overlays. Seven add optional checks that are off by default.
  - Each check was added after a real failure on a camera. It had to fail the broken image and pass both the fixed
    image and the stock firmware. Eight of the eleven patches are not tied to one camera body. The two that start
    the second and third processor cores carry E-M5 III addresses, and the kernel-check patch names one E-M5 III
    address.
