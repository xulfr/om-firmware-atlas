    - The maintainer reports better Quasi-LUT conversion from LUT and XMP, fixed grain and OM-3 indicator, and a
      faster macOS Quasi-LUT editor.
    warning: 'The maintainer calls this a beta. No test procedure, results or hashes are given.'
