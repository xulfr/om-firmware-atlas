    warning: Upstream calls this a beta. The notes list one bug fix and no physical-camera result; the maintainer does
      not own an original OM-5.
    source_ref: source.db.release045
  - tag: dbv0.4.4b
    title: db firmware v0.4.4b beta
    date: '2026-11-22'
    url: https://github.com/azqeurio/om-c-firmware/releases/tag/dbv0.4.4b
    prerelease: false
    camera_ids:
    - camera.om3
    - camera.om5
    - camera.om5-ii
    - camera.ep7
    highlights:
    - Reports a fix for the double restart with Hybrid Shutter on the OM-5, OM-5 Mark II, E-M1 III, E-M1X and E-P7.
    - Reports Super Control Panel drive mode and Wi-Fi fixes for the OM-5 port, and shortcut button, AF Home and Korean
      font fixes for E-P7 1.1.
    - Reports fixes for Quasi-LUT’s startup menu state, Panasonic aperture rings, electronic shutter sound in MF and
      Auto ISO minimum shutter speed in P/A.
    warning: Upstream calls this a beta. The notes provide no physical-camera results for the claimed fixes.
    source_ref: source.db.release044b
  - tag: dbv0.4.4
    title: db firmware v0.4.4 beta
    date: '2026-11-21'
    url: https://github.com/azqeurio/om-c-firmware/releases/tag/dbv0.4.4
    prerelease: false
    camera_ids:
    - camera.om5
    highlights:
    - Reports a fix for the Mark II-based OM-5 port’s black screen at boot.
    - Raises the burst buffer for the OM-1 Mark II port on the original OM-1 from 80 to 85 frames.
    warning: The OM-5 boot fix was checked in CPU simulation and an emulator. The maintainer asked testers to keep
      stock recovery firmware and reported no physical-camera test.
    source_ref: source.db.release044
  - tag: dbv0.4.3b
    title: db firmware v0.4.3b beta
    date: '2026-11-21'
    url: https://github.com/azqeurio/om-c-firmware/releases/tag/dbv0.4.3b
    prerelease: false
    camera_ids:
    - camera.om3
    - camera.om5
    - camera.om5-ii
    - camera.ep7
    highlights:
    - The maintainer adds Hybrid Shutter mode persistence on supported bodies and Quasi-LUT persistence on the OM-3
      and listed OM-1 variants.
    - The maintainer reports a fix for an OM-3 Quasi-LUT boot loop and adds red/blue channel swap for infrared on
      a separate set of models.
    warning: The release still lists the Mark II-based OM-5 port as broken.
    source_ref: source.db.release043b
