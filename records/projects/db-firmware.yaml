  - name: Quasi-LUT and DBLink
    summary: Quasi-LUT with DBLink transfer. On OM-3, v0.4.3b adds power-cycle persistence for the on/off state and selected slot.
    camera_ids:
    - camera.om3
    status: beta
    since: dbv0.4.1
    source_ref: source.db.release043b
  - name: OM-1 Mark II features on the OM-1
    summary: A port of OM-1 Mark II firmware to the OM-1, without ND128 or the larger buffer.
    camera_ids: []
    status: beta
    since: null
    source_ref: source.db.release041
  - name: 12.5 and 16.7 fps bursts
    summary: Extra burst rates on the OM-1 with the SH2 shutter mode.
    camera_ids: []
    status: beta
    since: null
    source_ref: source.db.releases
  - name: 5 GHz hotspot and shutter sound
    summary: A 5 GHz Wi-Fi hotspot, and the electronic shutter sound through the speaker.
    camera_ids: []
    status: beta
    since: null
    source_ref: source.db.releases
  - name: Hybrid Shutter
    summary: Switches to the electronic shutter on overexposure in P or A mode and, since v0.4.3, below the
      slowest mechanical speed in S or M mode. In v0.4.3b the project adds retention of the selected mode across power cycles.
    camera_ids:
