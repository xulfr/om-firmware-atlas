  status_summary: The latest reviewed release is v0.4.5 beta, which reports an OI Share connection fix for the Mark
    II-based OM-5 port. The README says the maintainer tests on real OM-1, OM-5 Mark II and E-M10 bodies only; other
    models are checked in offline simulation. The release notes add no physical-camera result.
  related_projects: []
  tagline: Feature patches across many OM SYSTEM and Olympus bodies, from aperture rings to new burst
    rates.
  camera_notes:
  - camera_id: camera.om5
    note: "Beta patches include Panasonic aperture rings, Korean menus and Hybrid Shutter. The Mark II-based port’s boot fix has only simulator and emulator results in the release notes."
  - camera_id: camera.om5-ii
    note: "Korean menus and Hybrid Shutter, both beta."
  - camera_id: camera.pen-f
