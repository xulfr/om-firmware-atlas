    - Medium and Coarse grain use rounder clumps with fewer repeated patterns.
    - A film’s white-balance compensation appears in the Super Control Panel. Edits there are saved with
      the film.
    - A new look set applies its white balance immediately to the current film.
    warning: Stock picture modes retain the last film’s compensation for that white-balance mode, according
      to the release notes.
    source_ref: source.om3.v0401
  - tag: v0.40
    title: Caduceus for OM-3 v0.40
    date: '2026-11-19'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40
    prerelease: false
    camera_ids: *id001
    highlights:
    - Releases XPan, 21:9 and 5:4 crops, black and white JPEG borders, and adjustable film grain.
    - Shows split tone, RGB curves and black-and-white changes live. Adds 17 rear-screen information toggles
      and extends focus stacking to more lenses.
    - Includes the beta3 fixes for quick shots and new film sets in custom modes. LookLab adds previews
      of the new settings.
    warning: 'Atlas issue #10 reports a crash at shutter release with Film Grain enabled on v0.40.
      The report gives no package hash and does not cover later releases.'
