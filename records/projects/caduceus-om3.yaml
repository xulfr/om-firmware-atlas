    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40.3-beta2
    prerelease: true
    camera_ids: *id001
    highlights:
    - 'No shut-down with Film Grain, Sequential drive and JPEG only when Low ISO Processing is Drive Priority (#91):
