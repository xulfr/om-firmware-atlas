  - tag: v0.40.2
    title: Caduceus for OM-3 v0.40.2
    date: '2026-11-20'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40.2
    prerelease: false
    camera_ids: *id001
    highlights:
    - Produces colour grain on every row to remove faint banding and reduces red–green speckling.
    - The maintainer reports a successful long burst on the test build later published as v0.40.2. An earlier
      test build rebooted during a burst.
    - LookLab previews the updated colour grain.
    warning: 'Known issue #91, listed later in the v0.40.3-beta notes: with Film Grain, Sequential and JPEG only, Drive Priority low-ISO
      processing switches the camera off on the first photo at ISO 1600 and below; workaround Detail Priority, RAW+JPEG
      or Single.'
    source_ref: source.om3.v0402
