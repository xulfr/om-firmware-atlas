  - label: Using it
    url: https://androidfanman.github.io/caduceus-om3/pages/using/
  - label: LookLab
    url: https://androidfanman.github.io/caduceus-om3/looklab/
  - label: Roadmap
    url: https://androidfanman.github.io/caduceus-om3/pages/roadmap/
  features:
  - name: Your films in Picture Mode
    summary: FILM 1–20 appear after COLOR 1–4, with their names on the title, quick menu, shooting screen
      and viewfinder.
    camera_ids: &id001
    - camera.om3
    status: released
    since: v0.24.1
    source_ref: source.om3.readme
  - name: 20 film simulations
    summary: Looks inspired by Portra, Gold, Ektar, Ektachrome, Kodachrome, CineStill 800T, Velvia, Provia,
      Superia and more, made only from the camera's own settings.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.om3.readme
  - name: Colour editor on the camera
    summary: Hue and luminance for each of 12 colours next to the camera's saturation, with Color Mix
      and RGB curves since v0.30.
    camera_ids: *id001
    status: released
    since: v0.11
    source_ref: source.om3.readme
    capability_id: capability.om3-hsl
  - name: Split toning
    summary: Tint shadows and highlights separately in 12 colours, with a Tone Balance row. Shows in live
      view.
    camera_ids: *id001
    status: released
    since: v0.26
    source_ref: source.om3.readme
  - name: Film grain
    summary: Colour grain made by the camera's image processor, as fast as a photo without grain.
    camera_ids: *id001
    status: released
    since: v0.25
    source_ref: source.om3.readme
  - name: Glow, clarity and halation
    summary: 'A Glow / Clarity row, and halation: a red glow around bright lights, strength 0–5.'
    camera_ids: *id001
    status: released
    since: v0.28
    source_ref: source.om3.readme
  - name: Changes kept per film
    summary: Edits stay with each film over power off. A * marks what changed; hold OK to reset.
    camera_ids: *id001
    status: released
    since: v0.25
    source_ref: source.om3.readme
  - name: Films stored in the camera
    summary: Films, your changes and the Extras settings live in the camera's memory, so any card works,
      or none.
    camera_ids: *id001
    status: released
    since: v0.29
    source_ref: source.om3.readme
  - name: White balance per film
    summary: Each film and COLOR remembers its white balance mode and Kelvin. From v0.40.1, film compensation
      shows in the Super Control Panel and edits there are saved with the film.
    camera_ids: *id001
    status: released
    since: v0.28
    source_ref: source.om3.v0401
  - name: Buttons and Creative Dial
    summary: All four arrow keys in Button Function; each Creative Dial position set to CRT, ART, COLOR
      or MONO, with its own film.
    camera_ids: *id001
    status: released
    since: v0.27
    source_ref: source.om3.readme
  - name: Film recipe in every photo
    summary: Each JPEG records its film and recipe in EXIF, so LookLab can open the film from a photo.
    camera_ids: *id001
    status: released
    since: v0.27
    source_ref: source.om3.readme
  - name: LookLab
    summary: Edit films in your browser and preview one film on up to 12 of your own photos at once. LookLab
      can open a card’s curves with its look file, read a recipe JSON, save your own film sims and keep your
      photos for the next visit. Everything stays in the browser.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.om3.looklab-current
  - name: Films from your LUTs and Lightroom presets
    summary: LookLab finds the camera settings closest to a .cube LUT or a Lightroom preset, with a match
      score.
    camera_ids: *id001
    status: testing
    since: null
    source_ref: source.om3.roadmap
  - name: Focus stacking with more lenses
    summary: Extends in-camera focus stacking to more lenses, including the M.Zuiko 17mm F1.8 II.
    camera_ids: *id001
    status: released
    since: v0.40
    source_ref: source.om3.v040-release
  - name: Panasonic aperture rings
    summary: The aperture ring on Panasonic lenses that have one sets the aperture.
    camera_ids: *id001
    status: planned
    since: null
    source_ref: source.om3.roadmap
  - name: Crop modes
    summary: XPan, 21:9 and 5:4 for JPEGs. RAW retains the full sensor with crop metadata.
    camera_ids: *id001
    status: released
    since: v0.40-alpha
    source_ref: source.om3.v040-release
  - name: Photo borders and film grain
    summary: Black or white JPEG borders and adjustable film grain with Fine, Medium and Coarse sizes.
      v0.40.2 reduces colour banding and red–green speckle.
    camera_ids: *id001
    status: released
    since: v0.40-alpha
    source_ref: source.om3.v0402
  - name: Shooting screen information
    summary: Choose which of 17 items appear on the rear screen in Information 1, 2 and 3.
    camera_ids: *id001
    status: released
    since: v0.40
    source_ref: source.om3.v040-release
  releases:
  - tag: v0.41-beta
    title: Caduceus for OM-3 v0.41-beta (test version)
    date: '2026-11-24'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.41-beta
    prerelease: true
    camera_ids:
    - camera.om3
    installation:
      camera.om3:
        firmware_id: firmware.om3-1100
        url: https://github.com/androidfanman/caduceus-om3/blob/27f155364d6b445ee72f647793e91e0cfad1b23f/releases/v0.41-beta/NOTES.md
    highlights:
    - INFO hints on the colour wheel's H / S / L bar and the Split toning bar; Balance shows only its bar.
    - Photo code om3.2 also carries the RGB curves, Color Mix, Film Grain strength and Grain Size. LookLab and the
      developer kit read both codes; other readers of om3.1 need updating.
    - The maintainer reports camera testing on an OM-3 on 23 and 24 November as builds a2 to a6 and pc3.
    warning: Test release. Upstream keeps v0.40.3 as its current version; roll back by making v0.40.3.
    source_ref: source.om3.v041-beta
  - tag: v0.41-alpha
    title: Caduceus for OM-3 v0.41-alpha (test version)
    date: '2026-11-23'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.41-alpha
    prerelease: true
    camera_ids: *id001
    highlights:
    - An H / S / L bar on the colour wheel, a five-point tone curve with Blacks and Whites as its ends, and Split
      toning on its own row with Balance.
    - The Blacks / Whites and Tone Balance rows leave Picture Mode's list; films keep their saved values.
    - The maintainer reports a camera test on an OM-3 on 23 November as build p4.
    warning: Early test release. Upstream keeps v0.40.3 as its current version.
    source_ref: source.om3.v041-alpha
  - tag: v0.40.3
    title: Caduceus for OM-3 v0.40.3
    date: '2026-11-23'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40.3
    prerelease: false
    camera_ids: *id001
    highlights:
    - Halation Radius (Bloom, Tight, Medium, Wide) per film, and Halation with about half the fixed work.
    - Films and COLOR keep their own white-balance shift; the camera's own picture modes keep the camera's (#99).
    - 'Fixes #91 (Film Grain on Drive Priority), #93 (film names in playback), #97 (Magnify in the crop modes) and
      #101 (Delete long press).'
    - The maintainer reports camera testing in each test version, finally as v0.40.3-beta4.
    warning: After updating from v0.40.1 or later, set the camera's own white-balance shift once. Long presses on the
      arrow keys still do nothing.
    source_ref: source.om3.v0403
  - tag: v0.40.3-beta4
    title: Caduceus for OM-3 v0.40.3-beta4 (test version)
    date: '2026-11-21'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40.3-beta4
    prerelease: true
    camera_ids:
    - camera.om3
    highlights:
    - Films and COLOR keep their own white-balance shift in live view and stills. The stock picture modes keep the
      camera’s own setting.
    - The maintainer reports testing the release as build w1 on an OM-3 on 21 November.
    warning: Test release. Upstream keeps v0.40.2 as its current release and asks owners to check their stock-mode
      white-balance shift once after updating.
    source_ref: source.om3.v0403-beta4
  - tag: v0.40.3-beta3
    title: Caduceus for OM-3 v0.40.3-beta3 (test version)
    date: '2026-11-21'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40.3-beta3
    prerelease: true
    camera_ids: *id001
    highlights:
    - 'Replaces the withdrawn v0.40.3-beta2, with the same #91, #97 and #99 fixes and without its boot loop on some
      start-ups or its restart on a film change after the Creative Dial''s centre.'
    - 'No shut-down with Film Grain, Sequential drive and JPEG only when Low ISO Processing is Drive Priority (#91):
      grain photos now take the Detail processing.'
    - Magnify and MF Assist work in 5:4, XPan and 21:9, and the Image Aspect screen shows the crops' names and sizes
      (#97).
    - The camera's own picture modes keep their own WB compensation, switched at the first half-press after a dial
      turn (#99).
    - 'A function on the Delete button now acts on a long press as on AF-ON (#101); the arrow keys still report no
      long press.'
    - The maintainer reports the build camera-tested on an OM-3 on 2026-11-21 as test build f9.
    warning: Test release; v0.40.2 stays the current version. The first time after updating, the camera's own modes
      may start with no WB compensation.
    source_ref: source.om3.v0403-beta3
  - tag: v0.40.3-beta2
