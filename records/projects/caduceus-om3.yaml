    date: '2026-11-20'
    url: https://github.com/androidfanman/caduceus-om3/releases/tag/v0.40.3-beta
    prerelease: true
    camera_ids: *id001
    highlights:
    - Halation Radius row (Bloom, Tight, Medium, Wide), per film; LookLab cannot set it yet.
