    - Playback shows each photo's own film name (#93).
    warning: 'Test release; v0.40.2 stays the current version. Known issue #91 (also in v0.40.1 and v0.40.2): with
      Film Grain, Sequential and JPEG only, Drive Priority low-ISO processing switches the camera off on the first
      photo at ISO 1600 and below; fixed in v0.40.3-beta2.'
