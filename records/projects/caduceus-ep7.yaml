  features:
  - name: On-camera look editor (HSLFX)
    summary: Film, Saturation, Hue, Light and Effects pages on the camera's own colour wheel; changed
      looks are marked with *.
    camera_ids: &id001
    - camera.ep7
    status: released
    since: null
    source_ref: source.ep7.readme
    capability_id: capability.ep7-hsl
  - name: 29 film simulations
    summary: Velvia, Classic Chrome, Kodachrome, Portra, Ektar, CineStill, Vision3, Polaroid, Cross Process
      and more, one per Colour Profile slot.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.ep7.readme
  - name: Colour mix and base curve
    summary: A per-look 3×3 colour matrix applied by the camera's image hardware, plus a choice of the
      camera's base tone curves.
    camera_ids: *id001
    status: released
    since: v0.34
    source_ref: source.ep7.readme
  - name: Split toning
    summary: Tint shadows and highlights separately in 12 colours, in live view and photos.
    camera_ids: *id001
    status: released
    since: v0.32
    source_ref: source.ep7.readme
  - name: Film grain
    summary: Film-like grain on colour photos, Off to High per profile.
    camera_ids: *id001
    status: released
    since: v0.27
    source_ref: source.ep7.readme
  - name: Tinted halation
    summary: A red-orange glow around bright lights, as on CineStill film.
    camera_ids: *id001
    status: released
    since: v0.31
    source_ref: source.ep7.readme
  - name: Tone per look
    summary: Each look carries its own tone curve, with new Blacks and Whites controls.
    camera_ids: *id001
    status: released
    since: v0.20
    source_ref: source.ep7.readme
  - name: Mono film presets
    summary: Pan F, Acros, T-Max, Tri-X, HP5, Delta 3200, sepia, selenium and cyanotype for the Monochrome
      Profiles.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.ep7.readme
  - name: True log video
    summary: A log curve hidden in the firmware, switched on with the Muted movie picture mode.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.ep7.readme
  - name: XPan 65:24 and 21:9 stills
    summary: Panorama and Wide aspect ratios with matching live view, playback and frame lines.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.ep7.readme
  - name: Live ND
    summary: 'ND3 and ND4 in Multiple Exposure: frames averaged at normal brightness.'
    camera_ids: *id001
    status: alpha
    since: null
    source_ref: source.ep7.readme
  - name: More button functions
    summary: More choices for REC and Fn, and the right and down arrow keys in Button Function.
    camera_ids: *id001
    status: released
    since: v0.29
    source_ref: source.ep7.readme
  - name: More dial functions
    summary: Custom Menu B › Dial Function can put ISO or flash compensation on the front dial in P, A, S and M; the
      rear dial keeps its job.
    camera_ids: *id001
    status: released
    since: v0.35
    source_ref: source.ep7.v035
  - name: M-mode dial for manual lenses
    summary: In M with a lens without contacts, the free dial sets ISO or exposure compensation. Ported from phocean's
      omsystem-ep7.
    camera_ids: *id001
    status: released
    since: v0.35
    source_ref: source.ep7.v035
  - name: Longer video recording
    summary: The 29-minute and 2-hour caps raised to 9 hours; file and heat limits still apply.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.ep7.readme
  - name: Selectable 4K bitrate
    summary: 150, 100 or 60 Mbit/s for 4K movie slots.
    camera_ids: *id001
    status: released
    since: v0.34
    source_ref: source.ep7.readme
  - name: Japanese and Chinese labels
    summary: Caduceus's own labels in Japanese or Simplified Chinese when the camera uses that language.
    camera_ids: *id001
    status: released
    since: v0.32
    source_ref: source.ep7.readme
  - name: Lens vignette correction off per look
    summary: Natural corners per look. The firmware setting is confirmed; its effect on photos is not
      yet, and reports are wanted.
    camera_ids: *id001
    status: testing
    since: v0.25
    source_ref: source.ep7.readme
  - name: Caduceus Control Panel
    summary: Make, preview and share looks in your browser, and export them for the camera or as RapidRAW
      presets.
    camera_ids: *id001
    status: released
    since: null
    source_ref: source.ep7.readme
  releases:
  - tag: v0.35
    title: Caduceus v0.35 (beta)
    date: '2026-11-23'
    url: https://github.com/cakelesscoder/caduceus-ep7/releases/tag/v0.35
