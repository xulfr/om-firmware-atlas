        url: https://github.com/cakelesscoder/caduceus-ep7/blob/7ae6366e1c48a5557f586728c2148f71ee61016f/docs/INSTALL.md
    highlights:
    - ISO or flash compensation on the front dial, and an ISO or exposure-compensation dial in M with a manual lens.
    - The colour wheel opened from the Shortcut button no longer flashes; Movie Extras rows show the right names.
    - Card files are unchanged from v0.34a.
    warning: Beta. Known issue, the full Colour Profile page does not show film names properly; pick films from the
      colour wheel in the Super Control Panel. The author warns that flashing modified firmware can crash or brick the
      camera; never flash an E-P7 build on another body.
    source_ref: source.ep7.v035
