  - camera_id: camera.em10-iv
    note: "No build for this camera. Caduceus's body survey includes the E-M10 IV in its firmware-signature comparisons for possible ports; nothing has been ported."
  description:
  - 'Caduceus is where the family started: open-source firmware patches for the Olympus PEN E-P7 on firmware
    1.1. Its heart is HSLFX, which gives every Colour Profile hue, saturation and lightness per colour,
    plus effects such as film grain, tinted halation, bloom and clarity, all edited on the camera''s own
    colour wheel.'
  - Beyond colour it adds 29 film simulations and black-and-white presets, true log video, XPan 65:24
    and 21:9 stills, Live ND, a minimum shutter speed and longer video recording. The Caduceus Control
    Panel, a browser tool, makes looks, shares them as short codes, and exports them as RapidRAW presets
    for any camera's raw files.
  - 'The author calls it beta and experimental: flashing modified firmware can crash or brick the camera.
    Every patch is checked in an emulator first, and the restore path has been proven on a real E-P7.'
  goals:
  - More film looks, and an Art Effect preview in live view.
  - One-press Live ND, faster grain saves, clean HDMI output and ISO Auto in movie M.
  - 'Ports to other bodies: an E-M10 Mark IV port needs a volunteer tester, and an E-M5 Mark III port
    needs a camera owner.'
