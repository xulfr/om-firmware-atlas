  releases:
  - tag: v0.2.0-alpha1
    title: Caduceus OM-5 Mark II v0.2.0-alpha1
    date: '2026-11-20'
    url: https://github.com/xulfr/caduceus-om5/releases/tag/v0.2.0-alpha1
    prerelease: true
    camera_ids: [camera.om5-ii]
    highlights:
    - Black and White points, split-tone controls and live-view updates without a half-press.
    - Picture Mode stays open 30 seconds; startup guard on the gamma hook after an intermittent boot loop on a
      development build.
    - The owner reports that the candidate works perfectly; start counts and the on-card checksum were not reported.
    warning: For E148 firmware 1.1. Verify the file on the card against the checksum in the release notes.
    source_ref: source.om5.releases
  - tag: v0.1.0-alpha12
    title: Caduceus OM-5 Mark II v0.1.0-alpha12
    date: '2026-11-16'
    url: https://github.com/xulfr/caduceus-om5/releases/tag/v0.1.0-alpha12
    prerelease: true
    camera_ids:
    - camera.om5-ii
    highlights:
    - Restores the Monochrome Color Filter graphic.
    - The owner reports that the alpha12 checks were completed, without a step-by-step record.
    warning: Experimental. The installer keeps its experimental-build acknowledgement; installing can
      leave a camera unable to start.
    source_ref: source.om5.releases
