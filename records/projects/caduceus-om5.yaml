  tagline: Looks and a full colour editor for the OM-5 Mark II. Experimental.
  description:
  - Caduceus for OM-5 brings back the three Color Profile and three Monochrome Profile slots that the
    OM-5 Mark II's firmware hides, and gives them custom looks and a colour editor in the style of the
    other Caduceus projects.
  - Looks are made in a browser LookLab and copied to the card as one file. In Picture Mode the trash
    button steps through them, and the chosen look is then kept in the camera. Each Color Profile gets
    hue, saturation and lightness for 12 colours, a tone curve with Black and White, split toning (a
    Shadow, Midtone and Highlight Tint) and its own white balance. Live ND32 and ND64 join the camera's
    Live ND settings.
  - This is the most experimental project here. v0.2.0-alpha1 runs on the owner's camera, with an overall
    owner report that leaves out start counts and the on-card checksum. Five earlier builds failed on that
    camera and were restored, and a v0.2.0 development package boot-looped intermittently before the release. There is no working version for
    the original OM-5. Read the project's safety page before anything else.
  goals:
  - A documented camera check of every feature on the OM-5 Mark II, including per-profile white balance,
    persistence and recovery.
  - Clarity next; colour grain needs image-pipeline work on an experiment branch, before Glow and Halation.
  - A second stage for the original OM-5, which has no working build yet.
