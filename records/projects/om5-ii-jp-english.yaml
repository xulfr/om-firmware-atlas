  status_summary: One owner reports a normal boot and English menus on a Japanese-market OM-5 Mark II on official 1.1
    after installing the resource-only r01 on 26 November 2026, with only partial follow-up checks. The repository
    reproduces the bytes offline from a separately supplied stock file whose digest matches the Atlas's 1.1 record.
    Full UI coverage, long-term reliability and recovery after a damaged resource are unverified. Native E148 only; it
    makes no claim for the original OM-5 (E144) or ports.
