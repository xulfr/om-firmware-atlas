  tagline: English menus on a Japanese-market OM-5 Mark II, by changing only its language resources.
  description:
  - Japanese-market OM-5 Mark II bodies show their menus in Japanese. This research found that the official 1.1 update
    already contains the English text, and builds a replacement for the language component only (component 0101). The
    Japanese language slot is pointed at an English-based table, keeping the original Japanese font. No program code
    and no region setting is changed.
  - English has no text for 39 messages the Japanese firmware shows; the researchers wrote their own translations for
    those, which are not official. The table fits within the firmware's own string buffer, though that does not prove
    every line fits every screen.
  - The repository holds Python code, tests and exact hashes to rebuild the file offline from your own copy of the
    stock 1.1 update, and no firmware. The research was carried out with AI agents and the camera steps by the owner.
    It is experimental; even a resource-only update erases and rewrites a 12 MiB range, and recovery after a damaged
    resource is unknown.
