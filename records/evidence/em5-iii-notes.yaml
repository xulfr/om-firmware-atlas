  procedure: Test builds flashed from the SD card, each adding one step of the OM-5 live-view preview; results recorded
    per step.
  coverage:
  - Job 12 reset, add, slide and average steps give correct results on E-M5 III frames.
  - The window follows the dial up to 240 frames at 30 fps with LV Simulation on (2026-11-12).
  - Borrowed frames go back before a photo and the preview returns after it (2026-11-15).
  - The blur restarts on shutter changes; a gyro-based movement restart felt right in a first test (2026-11-17).
  limitations:
  - Test builds are not published.
  - Movement restart is still being tuned.
  assumptions: []
- type: evidence
  id: evidence.em5-iii-wifi-shell-camera
  title: 'E-M5 III 1.7: card-file debug shell tested'
  summary: The E-M5 III firmware notes report the method working on a stock E-M5 III, with a live sequencer trace.
  source_refs:
  - source.em5n.wifi-shell
  topics:
  - tooling
  last_reviewed: '2026-11-18'
  camera_id: camera.em5-iii
  firmware_id: firmware.em5-iii-1700
  project_id: project.oly-fw-analysis
  mod_build: stock 1.7 with a card settings file
  method: physical-camera
  provenance: firsthand-tester-report
  identity_level: not-applicable
  package_sha256: null
  expected_package_sha256: null
  outcome: pass
  quality: partial
  reported_on: '2026-11-12'
  tested_on: '2026-11-12'
  procedure: Card file PARAMDT/CP000001.CSV with one line setting 0xF971 to 1; laptop joined the open network and
    connected to port 23 with CRLF line endings.
  coverage:
  - The laptop got an address by DHCP and the shell prompt appeared.
  - help listed the 58 user commands.
  - take dbgmode 1 streamed the shooting-sequencer trace live; the body shutter worked normally.
  limitations:
  - LF-only line endings get no answer.
  - A second connection after closing the first gets no answer until a power cycle.
  - The undo check (file removed, network gone) was not reported yet.
  assumptions: []
