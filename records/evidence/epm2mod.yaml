  tested_on: '2026-11-25'
  procedure: Before the flash, free-space, op, hook, boot and update-path checks passed, and the peaking code ran in a
    harness with the late segments not copied. The owner then ran a test sheet that included starts after 2 minutes
    off and with the battery out.
  coverage:
  - The label, MF peaking lines, MF Assist, no peaking in S-AF, and spot metering by touch worked.
  - The debug log shows cold starts and starts with RAM kept that end normally.
  limitations:
  - The owner's bodies never showed the slow start, so the start time on an affected body is not confirmed with this
    build.
  - A contributor's own build of the same change started at once on an affected body; that build is not published.
  - One owner; not reproduced by the Atlas.
  assumptions: []
