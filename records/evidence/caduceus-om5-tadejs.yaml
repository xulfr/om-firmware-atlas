- type: evidence
  id: evidence.om5-tadejs-color-core-emu
  title: 'Original OM-5 COLOR 1–3 back end: emulator runs'
  summary: 'Native runs in om-emu: each profile supplies its own 12 saturation values; other modes unchanged.'
  source_refs:
  - source.tom5.port
  - source.tom5.worklog
  topics:
  - emulation
  - colour
  last_reviewed: '2026-11-20'
  camera_id: camera.om5
  firmware_id: firmware.om5-1200
  project_id: project.caduceus-om5-tadejs
  mod_build: om5_color_core
  method: emulator
  provenance: maintainer-summary
  identity_level: not-applicable
  package_sha256: null
  expected_package_sha256: null
  outcome: reported-pass
  quality: partial
  reported_on: '2026-11-08'
  tested_on: null
  procedure: 'Capture-path code entered natively in a booted om-emu E144 session with chosen property values; the port''s verifier reports all checks passing.'
  coverage:
  - 'Profiles 1–3 read their own saturation values; profile 0 or above 3, and other modes, keep stock behaviour.'
  - 'Model check still passes on the rear screen and EVF with the patch applied.'
  limitations:
  - 'om-emu does not emulate the image pipeline and never reaches this capture path in normal use; no photo was taken.'
  - 'Only saturation is per profile; contrast, sharpness and other profile values are not loaded.'
  - 'No Picture Mode entry, so the mode cannot be chosen on a camera. Not run on a camera.'
  assumptions:
  - 'That the real firmware reaches this capture path for a normal still shot is the port''s inference.'
  emulator:
    url: https://github.com/flatpanda/om-emu
    revision: 147ca89
    model: E144
    stand_ins:
    - Capture-path code entered directly with chosen registers and property values
    - Image pipeline not emulated
