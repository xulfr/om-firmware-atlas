schema_version: 1
records:
- type: capability
  id: capability.em5-iii-profile-editor
  title: E-M5 III 1.7 Color / Monochrome Profile with an on-camera wheel editor
  summary: Test builds make the hidden Color and Monochrome Profile modes selectable and editable on the camera; edits show in live view and photos.
  source_refs:
  - source.em5n.profiles
  - source.om5.readme
  topics:
  - colour
  last_reviewed: '2026-11-20'
  camera_id: camera.em5-iii
  firmware_id: firmware.em5-iii-1700
  project_id: project.em5-iii-notes
  mod_build: unpublished test builds (2026-11-19 to 2026-11-20)
  feature_id: feature.colour.profile-editor
  assertion: Color Profile and Monochrome Profile (three slots each) are entries in the Picture Mode carousel; INFO
    opens an editor with the colour or mono wheel (the E-M1 III 1.6 wheel routines, relocated) and a side bar with
    dial-set rows; colour (12 hue sectors) and mono (filter, level) edits apply to live view and photos, and per-slot
    sharpness and contrast are set from the Super Control Panel.
  availability: experimental-branch
  implementation: reported
  evidence_refs:
  - evidence.em5-iii-profile-editor-camera
  contradicting_refs: []
  limitations:
  - Test builds only; none is published.
  - The firmware already holds the profile settings and processing; the builds add selection and the editor.
  - Restoring the hidden slots follows the Caduceus OM-5 II port; card-loaded looks are not built yet.
  - The wheel pictures come from the PEN-F, because the E-M1 III does not ship them.
